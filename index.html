<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsForLunch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav">
        <div id="map"></div>
        <div class="search">
            <input id="search-input" class="form-control">
            <button class="btn btn-secondary" id="addBtn">加入清單</button>
        </div>
        <div class="right_side">
            <div class="content">
                <h3>我的美食口袋名單</h3>
             <h4 class="mt-4">我的最愛</h4> <!--mt-4 -> margin-top 4px(bootstrap語法) -->
             <a href="#" class="closelist"><i class='bx bx-menu-alt-right'></i></a>
             <ul class="list-group list-group-flush list-group-numbered" 
                id="restaurant-list">
             </ul>
             <button id="draw" class="draw btn btn-secondary">抽籤</button>

             <div id="wheel">
                <canvas id='canvas' width="600" height="600"></canvas>
             </div>
            </div>
        </div>
        <div class="listbtn">
        <i class='bx bxs-chevron-up'></i>
        </div>
    </div>
    <script src="./Winwheel.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
    <script src="script.js"></script>
    <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAO5DLD0xcKn-36dJDtxP2jcGfZpPECyR8&loading=async&libraries=places&callback=initMap">
</script>
</body>
</html>
